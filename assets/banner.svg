      <stop stop-color="#0B1020"/>
      <stop offset="0.5" stop-color="#111A33"/>
      <stop offset="1" stop-color="#1A1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="40" x2="1080" y2="280" gradientUnits="userSpaceOnUse">
