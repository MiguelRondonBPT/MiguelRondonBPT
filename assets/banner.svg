      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="1280" height="320" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
