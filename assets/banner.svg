  <text x="72" y="192" fill="#C7D2FE" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Microsoft Fabric | AI Solutions | Modern Data Platforms</text>
  <text x="72" y="232" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Building scalable data solutions with analytics, automation, ML, and intelligent architectures.</text>

